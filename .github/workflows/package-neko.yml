name: package-neko

# Build RENGEAR packaged with the **Neko** engine (its pygame layer) for Linux
# and Windows, producing `rengear-neko-<platform>.zip` with a `rengear` /
# `rengear.bat` launcher. On a `v*` tag the zips are attached to a Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: neko (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
    steps:
      - name: Checkout RENGEAR
        uses: actions/checkout@v4

      - name: Checkout Neko
        uses: actions/checkout@v4
        with:
          repository: Renan2010p/neko
          path: neko

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Zig 0.16.0 is fetched straight from ziglang.org (the setup-zig action's
      # mirrors do not reliably carry 0.16.0). Neko targets 0.16.0: 0.17.0
      # removed `b.args` / `b.getInstallPath` from `std.Build`.
      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        env:
          ZIG_VERSION: "0.16.0"
        run: |
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZIG_VERSION: "0.16.0"
        run: |
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          "$env:GITHUB_WORKSPACE\zig-x86_64-windows-$env:ZIG_VERSION" | Out-File -Append $env:GITHUB_PATH

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install SDL2 (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" } else { "C:\vcpkg\vcpkg.exe" }
          & $vcpkg install sdl2 sdl2-image sdl2-ttf sdl2-mixer --triplet x64-windows
          $root = "C:\vcpkg\installed\x64-windows"
          "SDL2_INCLUDE=$root\include" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SDL2_LIB=$root\lib" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SDL2_BIN=$root\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Package with Neko
        env:
          NEKO_DIR: ${{ github.workspace }}/neko
        run: python -m tools.package_neko

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rengear-neko-${{ matrix.name }}
          path: rengear-neko-*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
